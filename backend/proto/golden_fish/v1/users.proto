syntax = "proto3";

package golden_fish.v1;

option go_package = "github.com/sklep/golden-fish/gen/golden_fish/v1;golden_fishv1";

import "google/protobuf/timestamp.proto";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string address = 6;
  string city = 7;
  string postal_code = 8;
  google.protobuf.Timestamp created_at = 9;
  bool is_admin = 10;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RegisterResponse {
  User user = 1;
  string token = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string token = 2;
}

message GetProfileRequest { string token = 1; }
message GetProfileResponse { User user = 1; }

message UpdateProfileRequest {
  string token = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 4;
  string address = 5;
  string city = 6;
  string postal_code = 7;
}

message UpdateProfileResponse { User user = 1; }
