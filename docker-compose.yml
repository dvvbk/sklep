version: "3.9"

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:alpine
    container_name: zlota-rybka-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golden_fish
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golden_fish"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ─── Go gRPC Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zlota-rybka-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: golden_fish
      PORT: "8080"
      JWT_SECRET: "change-this-in-production-use-strong-secret"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{}' --header='Content-Type: application/json' http://localhost:8080/grpc.health.v1.Health/Check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network
    restart: unless-stopped
  # ─── Next.js Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zlota-rybka-frontend
    environment:
      # In browser, calls go to localhost:8080 (exposed port)
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


volumes:
  postgres_data:
    name: zlota-rybka-postgres-data

networks:
  app-network:
    name: zlota-rybka-network
    driver: bridge
